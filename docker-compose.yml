services:
  ISKABE:
    image: iskabe:latest
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: "true"
      SHARP_CONCURRENCY: 2
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    container_name: ISKABE
